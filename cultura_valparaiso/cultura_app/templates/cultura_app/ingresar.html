<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · CultiValpo</title>
</head>
<body>
    <main>
        <h1>Iniciar sesión</h1>
        <p>Ingresa tu nombre de usuario y contraseña.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <p>
                <label for="{{ form.username.id_for_label }}">Nombre de usuario</label>
                {{ form.username }}
                {{ form.username.errors }}
            </p>
            <p>
                <label for="{{ form.password.id_for_label }}">Contraseña</label>
                {{ form.password }}
                {{ form.password.errors }}
            </p>
            <button type="submit">Iniciar sesión</button>
        </form>
        <p>¿Aún no tienes una cuenta? <a href="{% url 'registrar' %}">Crear cuenta</a></p>
    </main>
</body>
</html>
